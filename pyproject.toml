[project]
name = "protocol-to-usdm"
version = "0.1.0"
description = "Clinical trial protocol PDF -> reviewed intermediate model -> USDM v4 workbook -> USDM JSON"
readme = "README.md"
# Hard pin: usdm4 -> cdisc-rules-engine requires >=3.12,<3.13.
requires-python = ">=3.12,<3.13"
dependencies = [
    # USDM v4 workbook -> JSON (Stage C). Ships bundled CT + BC caches; no CDISC API key required.
    "usdm4-excel>=0.10.0",
    "usdm4>=0.29.0",
    # Web backend
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Pipeline
    "anthropic>=0.40",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "tenacity>=8.3",
    "python-slugify>=8.0",
    "rapidfuzz>=3.14.6",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "studies"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Agent prompts and worked examples are content; wrapping them would change what the model reads.
"backend/pipeline/agents/*.py" = ["E501"]
"backend/pipeline/segmentation/suggest.py" = ["E501"]  # prompt text

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["backend"]

[[tool.mypy.overrides]]
module = ["usdm4.*", "usdm4_excel.*", "simple_error_log.*", "fitz.*", "pymupdf.*", "openpyxl.*", "slugify.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: imports a written workbook with usdm4-excel (about 20 s each)"]
